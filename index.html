<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:10px}
h1{color:red;text-align:center}
#videoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#111;border-radius:12px;overflow:hidden}
.card iframe{width:100%;aspect-ratio:9/16;border:0;background:#000}
.card p{padding:8px;margin:0;font-size:14px}
button{padding:10px 20px;border-radius:8px;border:0;background:#222;color:#fff;margin:10px auto;display:block}
</style>
</head>
<body>
<h1>NAIJA FLIX</h1>
<div id="status" style="text-align:center;color:#aaa">Loading...</div>
<button onclick="localStorage.clear();location.reload()">Clear Broken Videos (Tap here first)</button>
<button onclick="loadVideos()">⟳ Refresh</button>
<div id="videoGrid"></div>

<script>
function loadVideos(){
 const grid=document.getElementById('videoGrid');
 const status=document.getElementById('status');
 let videos=JSON.parse(localStorage.getItem('videos')||'[]');
 if(!videos.length){status.textContent='No videos - go to Secret Admin';grid.innerHTML='';return;}
 status.textContent=`Showing ${videos.length} videos`;
 grid.innerHTML=videos.map(v=>{
   // Convert pixeldrain api link to embed link
   let url=v.video.trim();
   let id=url.split('/file/')[1]||url.split('/u/')[1]||'';
   id=id.split('?')[0].split('/')[0];
   let embed=`https://pixeldrain.com/u/${id}?embed`;
   return `<div class="card"><iframe src="${embed}" allowfullscreen allow="autoplay;fullscreen"></iframe><p>${v.title}</p></div>`;
 }).join('');
}
loadVideos();
</script>
</body>
</html>
