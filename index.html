<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAIJA FLIX</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial}
header{padding:15px;background:#000;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{color:red;font-size:22px}
#search{padding:8px 12px;border-radius:20px;border:none;width:50%}
#movies{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:15px}
.movie-card{position:relative;border-radius:12px;overflow:hidden;background:#1a1a1a;cursor:pointer}
.movie-card img.poster{width:100%;height:230px;object-fit:cover;display:block}
.play-btn{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(255,0,0,0.85);width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}
.movie-card video{width:100%;height:230px;display:none;background:#000}
.movie-card.playing img.poster,.movie-card.playing .play-btn{display:none}
.movie-card.playing video{display:block}
.movie-card h3{padding:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ageGate{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;display:flex;align-items:center;justify-content:center}
.ageBox{background:#1a1a1a;padding:25px;border-radius:15px;text-align:center;max-width:350px}
</style>
</head>
<body>

<div id="ageGate">
  <div class="ageBox">
    <h2>18+ Warning</h2>
    <p style="margin:15px 0;font-size:14px;">Mature audience only. All videos are legal & consensual.</p>
    <button onclick="document.getElementById('ageGate').style.display='none'" style="padding:10px 15px;border:none;border-radius:8px;background:red;color:white;width:100%;font-weight:bold;">I AM 18+ - ENTER</button>
    <button onclick="window.location.href='https://google.com'" style="padding:10px 15px;border:none;border-radius:8px;background:#333;color:white;width:100%;margin-top:8px;">EXIT</button>
  </div>
</div>

<header>
  <h1>NAIJA FLIX 😂</h1>
  <input id="search" placeholder="Search..." onkeyup="searchMovies()">
</header>

<div id="movies"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBKp2r9i4qV4oN4K4K4K4K4K4K4",
  authDomain: "naijaleakxxx.firebaseapp.com",
  databaseURL: "https://naijaleakxxx-default-rtdb.firebaseio.com",
  projectId: "naijaleakxxx",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let allMovies=[];
function loadMovies(){
  db.ref('movies').on('value', snap=>{
    allMovies=[]; document.getElementById('movies').innerHTML='';
    snap.forEach(child=>{ const m=child.val(); m.id=child.key; allMovies.push(m); addToPage(m); });
  });
}
function addToPage(movie){
  document.getElementById('movies').innerHTML+=`
    <div class="movie-card" onclick="playVideo(this)">
      <img class="poster" src="${movie.image}">
      <div class="play-btn">▶️</div>
      <video controls poster="${movie.image}" src="${movie.link}" preload="none"></video>
      <h3>${movie.title}</h3>
    </div>`;
}
function playVideo(card){
  const video=card.querySelector('video');
  const wasPlaying=card.classList.contains('playing');
  document.querySelectorAll('.movie-card').forEach(c=>{c.classList.remove('playing');c.querySelector('video').pause();});
  if(!wasPlaying){card.classList.add('playing');video.play();}
}
function searchMovies(){
  const q=document.getElementById('search').value.toLowerCase();
  document.getElementById('movies').innerHTML='';
  allMovies.filter(m=>m.title.toLowerCase().includes(q)).forEach(addToPage);
}
loadMovies();
</script>
</body>
</html>
