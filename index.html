<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:10px}h1{color:red;text-align:center}#videoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#111;border-radius:12px;overflow:hidden}.card video{width:100%;aspect-ratio:9/16;background:#000}.card p{padding:8px;margin:0}</style>
</head><body>
<h1>NAIJA FLIX</h1>
<div id="videoGrid" style="margin-top:20px"></div>
<script>
function loadVideos(){
 let grid=document.getElementById('videoGrid');
 let videos=JSON.parse(localStorage.getItem('videos')||'[]');
 if(videos.length===0){
   grid.innerHTML='<p style="text-align:center;color:#888">No videos yet</p>';
   return;
 }
 grid.innerHTML=videos.map(v=>`<div class="card"><video src="${v.video}" controls playsinline preload="metadata" poster="${v.poster}"></video><p>${v.title}</p></div>`).join('');
}
loadVideos();
</script></body></html>
