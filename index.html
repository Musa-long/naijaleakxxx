<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:10px}h1{color:red;text-align:center}#videoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#111;border-radius:12px;overflow:hidden;position:relative}.card iframe,.card video{width:100%;aspect-ratio:9/16;background:#000;border:0}.card p{padding:8px;margin:0}button{padding:10px;border-radius:8px;border:0;background:#222;color:#fff;margin:5px auto;display:block}</style>
</head><body>
<h1>NAIJA FLIX</h1>
<div id="status" style="text-align:center;color:#aaa">Loading...</div>
<button onclick="localStorage.clear();location.reload()">Clear All</button>
<button onclick="loadVideos()">⟳ Refresh</button>
<div id="videoGrid"></div>
<script>
function getId(u){let m=u.match(/\/([a-zA-Z0-9]+)$/);return m?m[1]:u.split('/').pop();}
function loadVideos(){
 let grid=document.getElementById('videoGrid'); let s=document.getElementById('status');
 let videos=JSON.parse(localStorage.getItem('videos')||'[]');
 s.textContent=videos.length?`Showing ${videos.length} videos`:'No videos';
 grid.innerHTML=videos.map(v=>{
   let url=v.video.trim();
   if(url.includes('pixeldrain')){
     let id=getId(url);
     let embed=`https://pixeldrain.com/u/${id}?embed`;
     return `<div class="card"><iframe src="${embed}" allowfullscreen></iframe><p>${v.title}</p></div>`;
   } else {
     return `<div class="card"><video src="${url}" controls playsinline poster="${v.poster}"></video><p>${v.title}</p></div>`;
   }
 }).join('');
}
loadVideos();
</script></body></html>
