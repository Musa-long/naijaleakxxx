<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAIJA FLIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial,sans-serif}
header{padding:15px;text-align:center;background:#111;position:sticky;top:0;z-index:10}
header h1{color:#ff0000;letter-spacing:2px}
#status{text-align:center;padding:10px;color:#aaa;font-size:14px}
#videoGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.video-card{background:#111;border-radius:12px;overflow:hidden}
.video-card video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000}
.video-card p{padding:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{text-align:center;padding:20px;color:#555;font-size:12px}
button#refreshBtn{background:#222;color:#fff;border:1px solid #333;padding:10px 20px;border-radius:8px;margin:10px}
</style>
</head>
<body>
<header>
<h1>NAIJA FLIX</h1>
</header>

<div id="status">Loading... If black, wait 60 seconds - Render is waking up.</div>
<center><button id="refreshBtn" onclick="loadVideos()">↻ Refresh</button></center>

<div id="videoGrid"></div>

<footer>
All content must be consensual, 18+ only, and owned by uploader. Non-consensual content will be removed and reported.
</footer>

<script>
const API_ENDPOINTS = ['/api/videos', '/api/get-videos', '/videos', '/api/list'];

async function loadVideos(){
  const status=document.getElementById('status');
  const grid=document.getElementById('videoGrid');
  status.textContent='Waking server... please wait 15-30s...';
  
  let serverVideos=[];
  
  // 1. Try to fetch from backend
  for(let url of API_ENDPOINTS){
    try{
      const r=await fetch(url,{cache:'no-store'});
      if(r.ok){
        const data=await r.json();
        if(Array.isArray(data) && data.length){ serverVideos=data; break; }
      }
    }catch(e){}
  }

  // 2. Get local videos saved from admin.html
  let localVideos=[];
  try{ localVideos=JSON.parse(localStorage.getItem('videos')||'[]'); }catch(e){}

  const allVideos=[...localVideos, ...serverVideos];

  if(allVideos.length===0){
    status.textContent='No videos yet. Go to Secret Admin to add. If you just added, wait 1 min and tap Refresh.';
    grid.innerHTML='<div style="grid-column:span 2;text-align:center;padding:40px;color:#666">No videos found.<br>Server may be sleeping.<br>Wait 60s then tap Refresh.</div>';
    return;
  }

  status.textContent=`Showing ${allVideos.length} videos`;
  
  grid.innerHTML=allVideos.map(v=>`
    <div class="video-card">
      <video 
        poster="${v.poster||''}" 
        src="${v.video||v.url||''}" 
        controls 
        playsinline
        preload="metadata">
      </video>
      <p>${(v.title||'Untitled').replace(/</g,'&lt;')}</p>
    </div>
  `).join('');
}

// Auto load
loadVideos();

// Try again after 8 seconds (Render wake up time)
setTimeout(loadVideos, 8000);
</script>
</body>
</html>
