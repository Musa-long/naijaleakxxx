<html>
<head>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.top{background:#111;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff0066;position:sticky;top:0;z-index:10}
.logo{color:#ff0066;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#1a1a1a;border-radius:12px;overflow:hidden;position:relative}
.poster{width:100%;height:220px;object-fit:cover;display:block;background:#222}
.playIcon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:55px;height:55px;background:rgba(255,0,102,0.85);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;pointer-events:none;border:3px solid #fff}
.info{padding:8px}
.info h3{font-size:12px;margin:0;height:32px;overflow:hidden}
#modal{display:none;position:fixed;inset:0;background:#000;z-index:999;flex-direction:column}
#modal video{width:100%;flex:1;background:#000}
#modalHeader{padding:12px;background:#111;display:flex;justify-content:space-between;align-items:center}
.close{background:#333;color:#fff;border:none;padding:8px 16px;border-radius:20px}
</style>
</head>
<body>
<div class="top"><div class="logo">NAIJALEAKXXX</div><a href="admin.html" style="background:#ff0066;color:#fff;padding:6px 12px;border-radius:15px;text-decoration:none;font-size:12px">ADMIN</a></div>
<div id="grid" class="grid">Loading 8 videos...</div>

<div id="modal">
<div id="modalHeader"><span id="mTitle">Playing</span><button class="close" onclick="closeModal()">CLOSE ✕</button></div>
<video id="videoPlayer" controls controlsList="nodownload" playsinline></video>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyB1FLMaz4IMHn9iP4GOTnI34Qk0YhKYXtw",authDomain:"loveflix-3092f.firebaseapp.com",projectId:"loveflix-3092f",storageBucket:"loveflix-3092f.firebasestorage.app",messagingSenderId:"767919494263",appId:"1:767919494263:web:ab97201d19619bf21ba272"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function load(){
  const q = query(collection(db,"videos"), orderBy("createdAt","desc"));
  const snap = await getDocs(q);
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  snap.forEach(docSnap=>{
    const v=docSnap.data();
    const el=document.createElement('div');
    el.className='card';
    el.innerHTML=`<img class="poster" src="${v.poster}" onerror="this.src='https://via.placeholder.com/300x400'"><div class="playIcon">▶</div><div class="info"><h3>${v.title}</h3></div>`;
    el.onclick=()=>{
      const modal=document.getElementById('modal');
      const player=document.getElementById('videoPlayer');
      document.getElementById('mTitle').textContent=v.title;
      modal.style.display='flex';
      player.src=v.video;
      player.load();
      player.play().catch(()=>{});
    };
    grid.appendChild(el);
  });
}
window.closeModal=()=>{
  document.getElementById('modal').style.display='none';
  const p=document.getElementById('videoPlayer');
  p.pause(); p.src='';
}
load();
</script>
</body>
</html>
