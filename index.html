    grid.innerHTML+=`<div class="card"><video src="${v.video}" controls playsinline preload="metadata" poster="${v.poster}" onclick="triggerAd()"></video><p>${v.title}</p></div>`;

    // AFTER EVERY 2 VIDEOS, INSERT BANNER AD
    if(count%2==0){
      grid.innerHTML+=`<div class="ad">ADVERT - Your Banner 300x250 Here<br><!-- PASTE ADSTERRA BANNER CODE HERE --></div>`;
    }
  });
}
