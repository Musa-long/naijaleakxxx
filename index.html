<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAIJA FLIX</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:10px}h1{color:red;text-align:center;font-weight:900}#videoGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.card{background:#111;border-radius:12px;overflow:hidden}.card video{width:100%;aspect-ratio:9/16;background:#000}.card p{padding:8px;margin:0;font-size:14px}</style>
</head><body>
<h1>NAIJA FLIX</h1>
<div id="status" style="text-align:center;color:#888">Loading from Firebase...</div>
<div id="videoGrid"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1FLMaz4IMHn9iP4GOTnI34Qk0YhKYXtw",
  authDomain: "loveflix-3092f.firebaseapp.com",
  projectId: "loveflix-3092f",
  storageBucket: "loveflix-3092f.firebasestorage.app",
  messagingSenderId: "767919494263",
  appId: "1:767919494263:web:ab97201d19619bf21ba272"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function load(){
  const q = query(collection(db, "videos"), orderBy("createdAt","desc"));
  const snap = await getDocs(q);
  const grid = document.getElementById('videoGrid');
  const status = document.getElementById('status');
  if(snap.empty){ status.textContent="No videos yet"; return; }
  status.textContent=`${snap.size} videos`;
  grid.innerHTML="";
  snap.forEach(doc=>{
    const v = doc.data();
    grid.innerHTML+=`<div class="card"><video src="${v.video}" controls playsinline preload="metadata" poster="${v.poster}"></video><p>${v.title}</p></div>`;
  });
}
load();
</script>
</body></html>
