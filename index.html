<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1FLMaz4IMHn9iP4GOTnI34Qk0YhKYXtw",
  authDomain: "loveflix-3092f.firebaseapp.com",
  projectId: "loveflix-3092f",
  storageBucket: "loveflix-3092f.firebasestorage.app",
  messagingSenderId: "767919494263",
  appId: "1:767919494263:web:ab97201d19619bf21ba272"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allVideos = [];

async function loadVideos(){
  const q = query(collection(db,"videos"), orderBy("createdAt","desc"));
  const snap = await getDocs(q);
  allVideos = [];
  snap.forEach(d=>{
    allVideos.push({id:d.id, ...d.data()});
  });
  render(allVideos);
}

function render(list){
  const grid = document.getElementById('grid');
  if(list.length==0){ grid.innerHTML="<p style='color:#888;padding:20px'>No videos found</p>"; return; }
  grid.innerHTML = list.map(v=>`
    <div class="card" onclick="playVideo('${v.video}','${v.title.replace(/'/g,"\\'")}')">
      <div class="thumbWrap">
        <img class="poster" src="${v.poster}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400?text=No+Image'">
      </div>
      <div class="info"><h3>${v.title}</h3></div>
    </div>
  `).join('');
}

window.filterVideos = ()=>{
  const term = document.getElementById('searchBox').value.toLowerCase();
  const filtered = allVideos.filter(v=>v.title.toLowerCase().includes(term));
  render(filtered);
}

window.playVideo = (src, title)=>{
  document.getElementById('mainVideo').src = src;
  document.getElementById('videoTitle').textContent = title;
  document.getElementById('playerModal').style.display='flex';
  document.getElementById('mainVideo').play();
}

window.closePlayer = ()=>{
  document.getElementById('playerModal').style.display='none';
  const vid = document.getElementById('mainVideo');
  vid.pause(); vid.src='';
}

loadVideos();
</script>
