<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#111;color:#fff;font-family:sans-serif;padding:20px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#222;color:#fff}button{width:100%;padding:14px;background:red;color:#fff;border:0;border-radius:8px;font-weight:700}</style></head><body>
<h2>Secret Admin - Firebase</h2>
<input id="title" value="ElserIs">
<input id="poster" value="https://i.imgur.com/8Km9tLL.jpeg">
<input id="video" value="https://files.catbox.moe/xlae10.mp4">
<button id="saveBtn">SAVE TO FIREBASE (Everyone will see)</button>
<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1FLMaz4IMHn9iP4GOTnI34Qk0YhKYXtw",
  authDomain: "loveflix-3092f.firebaseapp.com",
  projectId: "loveflix-3092f",
  storageBucket: "loveflix-3092f.firebasestorage.app",
  messagingSenderId: "767919494263",
  appId: "1:767919494263:web:ab97201d19619bf21ba272"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById('saveBtn').onclick = async ()=>{
  const title=document.getElementById('title').value;
  const poster=document.getElementById('poster').value;
  const video=document.getElementById('video').value;
  document.getElementById('msg').textContent="Saving...";
  await addDoc(collection(db,"videos"),{title,poster,video,createdAt:Date.now()});
  document.getElementById('msg').textContent="✅ SAVED! Now everyone sees it. Go to homepage.";
};
</script>
</body></html>
