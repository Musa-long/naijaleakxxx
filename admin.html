<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:15px}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#222;color:#fff}button{padding:12px;background:red;color:#fff;border:0;border-radius:8px;font-weight:700;width:100%;margin-top:5px}.card{background:#1a1a1a;padding:10px;border-radius:10px;margin:10px 0;display:flex;gap:10px;align-items:center}.card video{width:80px;height:120px;background:#000}</style></head><body>
<h2>Secret Admin</h2>
<input id="title" placeholder="Title" value="ElserIs">
<input id="poster" placeholder="Poster" value="https://i.imgur.com/8Km9tLL.jpeg">
<input id="video" placeholder="Video mp4 link" value="https://files.catbox.moe/xlae10.mp4">
<button id="saveBtn">SAVE NEW VIDEO</button>
<hr style="margin:20px 0;border-color:#333">
<div id="list">Loading your videos...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB1FLMaz4IMHn9iP4GOTnI34Qk0YhKYXtw",
  authDomain: "loveflix-3092f.firebaseapp.com",
  projectId: "loveflix-3092f",
  storageBucket: "loveflix-3092f.firebasestorage.app",
  messagingSenderId: "767919494263",
  appId: "1:767919494263:web:ab97201d19619bf21ba272"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function load(){
  const q = query(collection(db,"videos"), orderBy("createdAt","desc"));
  const snap = await getDocs(q);
  const div = document.getElementById('list');
  div.innerHTML = `<b>${snap.size} videos found (Firebase)</b>`;
  snap.forEach(d=>{
    const v=d.data();
    div.innerHTML+=`<div class="card"><video src="${v.video}" muted></video><div style="flex:1"><b>${v.title}</b><br><small>${d.id.slice(0,8)}</small></div><button style="width:auto;background:#555" onclick="del('${d.id}')">DELETE</button></div>`;
  });
}
window.del = async (id)=>{
  if(!confirm("Delete this duplicate?")) return;
  await deleteDoc(doc(db,"videos",id));
  load();
}
document.getElementById('saveBtn').onclick = async ()=>{
  await addDoc(collection(db,"videos"),{title:title.value,poster:poster.value,video:video.value,createdAt:Date.now()});
  alert("Saved!"); load();
}
load();
</script>
</body></html>
